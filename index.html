
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Roadmap Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CareerPath AI</h1>
        <p>Your personalized roadmap to a successful IT career</p>
    </header>

    <main>
        <section class="hero">
            <h2>Discover Your Future in IT</h2>
            <p>Tell us about yourself and get a career roadmap.</p>
        </section>

        <section class="form-card">
            <h2>Student Profile</h2>

            <form id="careerForm">
                <label for="studentName">Your Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name" required>

                <label for="interest">Career Interest</label>
                <select id="interest" required>
                    <option value="">Select your interest</option>
                    <option value="web">Web Development</option>
                    <option value="data">Data Science</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="cyber">Cybersecurity</option>
                    <option value="cloud">Cloud Computing</option>
                </select>

                <label for="level">Current Skill Level</label>
                <select id="level" required>
                    <option value="">Select your level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>

                <label for="hours">Study Hours Per Week</label>
                <input type="number" id="hours" min="1" max="80"
                       placeholder="e.g. 10" required>

                <button type="submit">Generate My Roadmap</button>
            </form>
        </section>

        <section id="result" class="result-card" hidden>
            <h2>Your Career Roadmap</h2>
            <div id="roadmapContent"></div>
        </section>
    </main>

    <footer>
        <p>AI Career Roadmap Generator | VAC Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
